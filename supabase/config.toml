# Supabase configuration for Automated Drill-and-Blast System

project_id = "your-project-id"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
port = 54325
image_transformation = {
  enabled = true
}

[auth]
enabled = true
port = 54326
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
enable_email_confirmations = false
enable_sms_confirmations = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

# Storage buckets configuration
[[storage.buckets]]
name = "drill-blast-files"
public = false
file_size_limit = 104857600  # 100MB
allowed_mime_types = ["image/*", "application/pdf", "text/csv", "application/json"]

[edge_runtime]
enabled = true
port = 54327

[analytics]
enabled = false